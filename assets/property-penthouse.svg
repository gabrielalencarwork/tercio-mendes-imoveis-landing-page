<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  <!-- Penthouse Window Frame -->
  <rect x="50" y="50" width="700" height="400" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="280" y1="50" x2="280" y2="450" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <line x1="520" y1="50" x2="520" y2="450" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- City Skyline View -->
  <rect x="100" y="250" width="60" height="200" fill="#1E293B"/>
  <rect x="180" y="200" width="80" height="250" fill="#0F172A"/>
  <rect x="300" y="150" width="100" height="300" fill="#1E293B"/>
  <rect x="440" y="220" width="70" height="230" fill="#0F172A"/>
  <rect x="540" y="180" width="110" height="270" fill="#1E293B"/>
  <text x="400" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#F5D77F">COBERTURA SKYLINE - VILA DA SERRA</text>
</svg>
