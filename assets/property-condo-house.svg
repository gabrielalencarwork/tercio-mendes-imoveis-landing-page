<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Modern Villa Silhouette -->
  <rect x="150" y="150" width="500" height="250" rx="8" fill="#1E293B" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <rect x="180" y="180" width="200" height="120" fill="rgba(212,175,55,0.15)" stroke="rgba(255,255,255,0.2)"/>
  <rect x="420" y="180" width="200" height="120" fill="rgba(212,175,55,0.15)" stroke="rgba(255,255,255,0.2)"/>
  <!-- Pool Reflection -->
  <rect x="100" y="420" width="600" height="60" rx="4" fill="#0284C7" opacity="0.8"/>
  <text x="400" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#F5D77F">CASA EM CONDOMÍNIO FECHADO</text>
</svg>
