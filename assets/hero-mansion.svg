<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="60%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(212,175,55,0.15)"/>
    </linearGradient>
    <linearGradient id="pool" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C65E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <!-- Background Sky -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- Mountain Silhouette -->
  <path d="M0 450 Q250 320 500 420 T1000 380 Q1100 350 1200 400 V800 H0 Z" fill="#040D1A" opacity="0.8"/>
  <!-- Modern Mansion Structure -->
  <rect x="350" y="250" width="750" height="350" rx="12" fill="#0F172A" stroke="url(#gold)" stroke-width="2"/>
  <!-- Glass Panels -->
  <rect x="380" y="280" width="320" height="140" fill="url(#glass)" rx="6"/>
  <rect x="730" y="280" width="340" height="140" fill="url(#glass)" rx="6"/>
  <rect x="380" y="440" width="690" height="130" fill="url(#glass)" rx="6"/>
  <!-- Interior Warm Lights -->
  <circle cx="500" cy="350" r="40" fill="#FEF08A" opacity="0.25" filter="blur(10px)"/>
  <circle cx="850" cy="350" r="50" fill="#FDE047" opacity="0.2" filter="blur(10px)"/>
  <!-- Infinity Pool -->
  <polygon points="100,580 1100,580 1050,750 150,750" fill="url(#pool)"/>
  <path d="M150 630 Q500 620 1050 630" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none"/>
  <!-- Overlay Title Card -->
  <rect x="50" y="50" width="380" height="120" rx="16" fill="rgba(7,15,30,0.85)" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="80" y="95" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#F5D77F">AYER PATRÍCIO</text>
  <text x="80" y="125" font-family="sans-serif" font-size="14" fill="#94A3B8" letter-spacing="2">RESIDÊNCIA ALPHA LUXURY | NOVA LIMA</text>
</svg>
